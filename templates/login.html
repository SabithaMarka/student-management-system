{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm p-4">
        <div class="card-body">
          <h2 class="h4 mb-1 text-center"><i class="bi bi-box-arrow-in-right text-primary"></i> Login</h2>
          <p class="text-muted text-center mb-4">Welcome back! Please sign in to continue.</p>

          {% if errors %}
            {% for err in errors %}
              <div class="alert alert-danger py-2 small mb-2">{{ err }}</div>
            {% endfor %}
          {% endif %}

          <form method="post" novalidate>
            <div class="mb-3">
              <label class="form-label" for="identifier">Email or Student ID</label>
              <input type="text" class="form-control" id="identifier" name="identifier"
                     value="{{ form_data.identifier }}" required autofocus />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" required />
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" tabindex="-1">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right"></i> Login</button>
            </div>
          </form>

          <p class="text-center mt-3 mb-0 small text-muted">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
