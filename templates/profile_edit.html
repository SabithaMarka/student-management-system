{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h1 class="h3 mb-3">Edit Profile</h1>
      <div class="card shadow-sm">
        <div class="card-body">
          {% if errors %}
            {% for err in errors %}
              <div class="alert alert-danger py-2 small mb-2">{{ err }}</div>
            {% endfor %}
          {% endif %}

          <form method="post" novalidate>
            <div class="mb-3">
              <label class="form-label">Student ID</label>
              <input type="text" class="form-control" value="{{ user.student_id }}" disabled />
              <small class="text-muted">Your Student ID cannot be changed.</small>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" class="form-control" id="name" name="name"
                       value="{{ form_data.name }}" required maxlength="100" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       value="{{ form_data.email }}" required maxlength="120" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="phone">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone"
                       value="{{ form_data.phone }}" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="department">Department</label>
                <input type="text" class="form-control" id="department" name="department"
                       value="{{ form_data.department }}" list="deptList" required maxlength="80" />
                <datalist id="deptList">
                  {% for d in departments %}<option value="{{ d }}">{% endfor %}
                </datalist>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="year">Year</label>
                <select class="form-select" id="year" name="year" required>
                  <option value="">Select year</option>
                  {% for y in years %}
                    <option value="{{ y }}" {% if form_data.year == y %}selected{% endif %}>Year {{ y }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Changes</button>
              <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
