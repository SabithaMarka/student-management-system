{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 mb-3">{{ heading }}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        {% for err in errors %}<div class="alert alert-danger py-2 small mb-2">{{ err }}</div>{% endfor %}
        <form method="post" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="code">Subject Code</label>
              {% if is_edit %}
                <input class="form-control" value="{{ form_data.code }}" disabled />
              {% else %}
                <input type="text" class="form-control" id="code" name="code" value="{{ form_data.code }}" required />
              {% endif %}
            </div>
            <div class="col-md-8">
              <label class="form-label" for="name">Subject Name</label>
              <input type="text" class="form-control" id="name" name="name" value="{{ form_data.name }}" required maxlength="120" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="department">Department</label>
              <input type="text" class="form-control" id="department" name="department" value="{{ form_data.department }}" list="deptList" required maxlength="80" />
              <datalist id="deptList">{% for d in departments %}<option value="{{ d }}">{% endfor %}</datalist>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="year">Year</label>
              <select class="form-select" id="year" name="year" required>
                <option value="">—</option>
                {% for y in years %}<option value="{{ y }}" {% if form_data.year == y %}selected{% endif %}>{{ y }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="semester">Sem</label>
              <select class="form-select" id="semester" name="semester" required>
                <option value="">—</option>
                {% for s in semesters %}<option value="{{ s }}" {% if form_data.semester == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="credits">Credits</label>
              <select class="form-select" id="credits" name="credits" required>
                <option value="">—</option>
                {% for c in credits %}<option value="{{ c }}" {% if form_data.credits == c %}selected{% endif %}>{{ c }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="faculty">Faculty Name</label>
              <input type="text" class="form-control" id="faculty" name="faculty" value="{{ form_data.faculty }}" maxlength="100" placeholder="Optional" />
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> {{ submit_label }}</button>
            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
