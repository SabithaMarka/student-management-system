{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 mb-3">{{ heading }}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        {% for err in errors %}<div class="alert alert-danger py-2 small mb-2">{{ err }}</div>{% endfor %}
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ form_data.title }}" required maxlength="200" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4" maxlength="2000">{{ form_data.description }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category">
              {% for c in categories %}
                <option value="{{ c }}" {% if form_data.category == c %}selected{% endif %}>{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> {{ submit_label }}</button>
            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
