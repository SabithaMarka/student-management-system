{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <h1 class="h3 mb-3 text-center">Change Password</h1>
      <div class="card shadow-sm">
        <div class="card-body">
          {% if errors %}
            {% for err in errors %}
              <div class="alert alert-danger py-2 small mb-2">{{ err }}</div>
            {% endfor %}
          {% endif %}

          <form method="post" novalidate>
            <div class="mb-3">
              <label class="form-label" for="current_password">Current Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="current_password" name="current_password" required />
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="current_password" tabindex="-1">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="new_password">New Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="new_password" name="new_password" required minlength="8" />
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="new_password" tabindex="-1">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <small class="text-muted">Min 8 chars, with at least one letter and one number.</small>
            </div>
            <div class="mb-3">
              <label class="form-label" for="confirm_password">Confirm New Password</label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="8" />
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary"><i class="bi bi-shield-lock"></i> Update Password</button>
              <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
